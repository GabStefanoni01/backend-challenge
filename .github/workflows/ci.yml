name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wagering
          POSTGRES_USER: wagering
          POSTGRES_PASSWORD: wagering
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wagering -d wagering"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install
      - run: bun run db:migrate
        env:
          DATABASE_URL: postgresql://wagering:wagering@localhost:5432/wagering
      - run: bun run db:rollback
        env:
          DATABASE_URL: postgresql://wagering:wagering@localhost:5432/wagering
      - run: bun run db:migrate
        env:
          DATABASE_URL: postgresql://wagering:wagering@localhost:5432/wagering
      - run: bun run build
      - run: bun run test
        env:
          DATABASE_URL: postgresql://wagering:wagering@localhost:5432/wagering
